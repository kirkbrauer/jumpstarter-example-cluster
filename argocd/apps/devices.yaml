#
# The virtual devices. For their live screen, point this at cluster/devices-with-screen instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jumpstarter-example-devices
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kirkbrauer/jumpstarter-example-cluster
    targetRevision: main
    path: cluster/devices
  destination:
    server: https://kubernetes.default.svc
    namespace: jumpstarter-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
