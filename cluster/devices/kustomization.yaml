#
# The virtual devices. The exporter image is named once, here: one built from ../../images/exporter.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cuttlefish-phone.yaml
  - cuttlefish-headunit.yaml
  - qemu-linux.yaml
patches:
  - target:
      kind: VirtualTargetClass
    patch: |-
      - op: replace
        path: /spec/images/exporter/image
        value: registry.example.com/jumpstarter/exporter:latest
