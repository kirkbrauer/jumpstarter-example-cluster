# SPDX-License-Identifier: Apache-2.0
#
# A virtual Android phone (Cuttlefish), leased with `device=cf-phone` or `type=phone`.
#
# The class says how one is made (the provisioner, the image, the machine); the set says how many there may be,
# what they are labelled, and which drivers a lease of one gets. A device exists while it is leased or kept
# ready (minAvailableReplicas), and is made anew after each lease.
#
# The exporter image is named in kustomization.yaml, for all of them.
#
# Cuttlefish needs KVM: the class asks for nodes labelled jumpstarter.dev/cuttlefish=true, and runs its Pod
# privileged under the service account cuttlefish-runtime (see ../cuttlefish-runtime.yaml).
#
# `bluetooth` and `wifi` are the device's radios, as ports that a lease's forwards join between two devices: what
# the Bluetooth suites use. `bluetooth` is also the device's own Bluetooth stack: `j phone bluetooth state`.
apiVersion: virtualtarget.jumpstarter.dev/v1alpha1
kind: VirtualTargetClass
metadata:
  name: cf-phone
  namespace: jumpstarter-lab
spec:
  bindingMode: Immediate
  images:
    exporter:
      image: registry.example.com/jumpstarter/exporter:latest
      imagePullPolicy: Always
  parameters:
    default_build: aosp-android-latest-release/aosp_cf_x86_64_only_phone-userdebug
    fetch_images: true
    runtime_memory_overhead_mb: 2048
    runtime_privileged: true
    service_account_name: cuttlefish-runtime
    vm_cpus: 4
    vm_memory_mb: 4096
    webrtc_turn: true
  provisioner: cuttlefish.jumpstarter.dev
  reclaimPolicy: Delete
  scheduling:
    nodeSelector:
      jumpstarter.dev/cuttlefish: 'true'
      kubernetes.io/arch: amd64
    resources:
      limits:
        memory: 6Gi
      requests:
        cpu: '2'
        memory: 6Gi
---
apiVersion: virtualtarget.jumpstarter.dev/v1alpha1
kind: ExporterSet
metadata:
  name: cf-phone
  namespace: jumpstarter-lab
spec:
  maxReplicas: 1
  minAvailableReplicas: 1
  minReplicas: 0
  recycleStrategy: ExitAndReplace
  scaleDownCooldown: 5m0s
  selector:
    matchLabels:
      device: cf-phone
  template:
    metadata:
      labels:
        device: cf-phone
        lab: cuttlefish
        type: phone
    spec:
      drivers:
      - config:
          env_config:
            instances:
            - vm:
                cpus: 4
                memory_mb: 4096
        name: cuttlefish
        type: jumpstarter_driver_cuttlefish.driver.Cuttlefish
      - config:
          address: 127.0.0.1:6520
          appium:
            capabilities:
              appium:settings[enableMultiWindows]: true
            env:
              ANDROID_HOME: /opt/android-sdk
            home: /opt/appium-home
          server_port: 15037
          transport: tcp
        name: android
        type: jumpstarter_driver_adb.driver.AdbDevice
      # The device's Bluetooth, as one entry (jumpstarter-driver-bluetooth). `link: bridge` is one half of a bridge
      # on the virtual radio's HCI port: the port `bluetooth`, which a forward of a lease joins to another
      # device's (../templates). `device` is the Android device itself, over the ADB server of `android` above:
      # who it is on the air, its adapter's state and bonds, Bluetooth on and off, and its HCI recorded.
      - config:
          class_of_device: 5898764
          device:
            adb: 127.0.0.1:6520
            adb_path: /opt/android-sdk/platform-tools/adb
          link: bridge
          name: Cuttlefish phone
          transport: tcp-client:127.0.0.1:7300
        name: bluetooth
        type: jumpstarter_driver_bluetooth.driver.Bluetooth
      # The device's Wi-Fi (jumpstarter-driver-wifi): a frame bridge beside its simulated medium, the port `hwsim`.
      - config:
          port: 7310
        name: wifi
        type: jumpstarter_driver_wifi.driver.WifiMedium
  virtualTargetClassName: cf-phone
