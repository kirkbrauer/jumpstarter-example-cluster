#
# One run of the contacts suite: the head unit downloads the phone's contacts, names in every script included.
#
#   oc -n <namespace> create -f tekton/run-bluetooth-contacts.yaml
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: bluetooth-contacts-
spec:
  pipelineRef:
    name: jumpstarter-robot-suite
  params:
    - name: image
      value: registry.example.com/jumpstarter/che-workspace:latest
    - name: suite
      value: tests/bluetooth_contacts.robot
  timeouts:
    pipeline: 30m
  workspaces:
    - name: client
      secret:
        secretName: jumpstarter-client
    # the reports last as long as the run's pod; give this a volumeClaimTemplate to keep them
    - name: results
      emptyDir: {}
